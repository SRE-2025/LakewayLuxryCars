name: Instagram feed

on:
  # Automatic refresh is paused: the saved token returns no Facebook Pages.
  # Verify a manual run succeeds with the correct Page/Instagram access before
  # restoring a schedule. Repeating the same failed request sends failure emails.
  workflow_dispatch:         # allows a manual run from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: instagram-feed
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test feed safety checks
        run: node --test scripts/fetch-instagram.test.js
      - name: Fetch latest Instagram posts
        env:
          META_FEED_TOKEN: ${{ secrets.META_FEED_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_AUTH_MODE: facebook
          FB_PAGE_ID: '61591662253130'
          IG_USERNAME: lakewayluxurycarsuites
          IG_COUNT: '9'
        run: node scripts/fetch-instagram.js
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/img/instagram assets/data/instagram.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "Auto-update Instagram feed"
            git push
          fi
      # GITHUB_TOKEN commits do not automatically trigger a Pages build.
      # Always request one after success, including retries after build failure.
      - name: Publish refreshed feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
