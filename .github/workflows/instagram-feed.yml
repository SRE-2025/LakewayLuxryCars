name: Instagram feed

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest Instagram posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_COUNT: '9'
        run: node scripts/fetch-instagram.js
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/img/instagram assets/data/instagram.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "Auto-update Instagram feed"
            git push
          fi
